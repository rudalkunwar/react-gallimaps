name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  react-min-version:
    name: Minimum React import smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Import the ESM build with the dev React version
        run: node -e "import('./dist/index.js').then(() => console.log('ESM import OK'))"

      - name: Install minimum supported React
        run: npm install --no-save --package-lock=false --legacy-peer-deps react@16.8.6 react-dom@16.8.6

      - name: Import the CJS build with React 16.8
        run: node -e "require('./dist/index.cjs'); console.log('React 16.8 CJS import OK')"
